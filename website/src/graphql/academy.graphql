# Public branding lookup — the only auth-free GraphQL query. Used to
# theme the page from the subdomain before the admin logs in.
query AcademyBySlug($slug: String!) {
  academyBySlug(slug: $slug) {
    documentId
    name
    slug
    primaryColor
    secondaryColor
    plan
    isActive
    logo {
      url
      alternativeText
    }
  }
}

# Authenticated — list every academy this session can see. For the
# platform super-admin today; will be scoped by users-permissions role
# once the admin panel ships.
query Academies($pagination: PaginationInput) {
  academies(pagination: $pagination) {
    documentId
    name
    slug
    plan
    isActive
  }
}

# Asaas integration status for the caller's academy. Returns the boolean
# status flags + webhook URL — never the raw credentials.
query MyAsaasSettings {
  myAsaasSettings {
    apiKeyConfigured
    webhookTokenConfigured
    environment
    webhookUrl
    apiKeyHint
  }
}

# Update Asaas credentials for the caller's academy. Empty fields preserve
# the current values, so the operator can rotate one secret at a time.
mutation UpdateMyAsaasSettings($data: AsaasSettingsInput!) {
  updateMyAsaasSettings(data: $data) {
    apiKeyConfigured
    webhookTokenConfigured
    environment
    webhookUrl
    apiKeyHint
  }
}

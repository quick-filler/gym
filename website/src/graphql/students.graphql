# The list query (Students) lives inline in src/lib/hooks.ts.
# This file keeps the detail + create operations used elsewhere.

# Single student detail — usado por /admin/students/[id] e pelo
# EditStudentDialog do /admin/students.
query StudentById($documentId: ID!) {
  student(documentId: $documentId) {
    documentId
    name
    email
    phone
    birthdate
    cpf
    gender
    address {
      type
      cep
      street
      number
      complement
      neighborhood
      city
      state
    }
    role
    status
    isGuardian
    notes
    photo {
      url
    }
    enrollments {
      documentId
      status
      startDate
      endDate
      paymentMethod
      plan {
        documentId
        name
        price
        billingCycle
      }
    }
    workoutPlans {
      documentId
      name
      instructor
      isActive
    }
  }
}

# Lista de planos ativos pro select do EditStudentDialog.
query AdminAvailablePlans {
  plans(pagination: { limit: 100 }) {
    documentId
    name
    price
    billingCycle
    isActive
  }
}

# Mutation usada pelo EditStudentDialog para salvar os campos do aluno.
mutation UpdateStudent($documentId: ID!, $data: StudentUpdateInput!) {
  updateStudent(documentId: $documentId, data: $data) {
    documentId
    name
    email
    status
  }
}

# Mutation usada pelo EditStudentDialog para vincular um plano sem ter
# que ir até /admin/finance.
mutation CreateEnrollmentFromStudent($data: EnrollmentInput!) {
  createEnrollment(data: $data) {
    documentId
    status
    startDate
    paymentMethod
    plan {
      documentId
      name
    }
  }
}

# Mutation used by the "New student" modal in the admin panel.
mutation CreateStudent($data: StudentInput!) {
  createStudent(data: $data) {
    documentId
    name
    email
    status
  }
}

# Bulk import — recebe linhas já parseadas no browser pelo wizard de
# /admin/students/import. Mantemos `dryRun` para o passo de preview validar
# duplicidades antes de persistir.
mutation BulkImportStudents($rows: [StudentImportRow!]!, $dryRun: Boolean) {
  bulkImportStudents(rows: $rows, dryRun: $dryRun) {
    created
    skipped
    errors
    items {
      rowNumber
      status
      studentDocumentId
      dependentDocumentId
      message
    }
  }
}
